      receipt_tail: "Скасувати до відправки — просто напишіть. Дзвонити не будемо; схему догляду надішлю разом із накладною."
      after_confirm: "{addr}гарний вибір для шкіри. Відправимо сьогодні або завтра, номер накладної напишу сюди. Нова пошта зазвичай доставляє за 1–2 дні. Разом із накладною надішлю схему на перший тиждень — як наносити, щоб був результат."

bundle:
  gift_text: "крем для очей вартістю 590 грн — у подарунок"
  one_parcel_text: "два засоби — одна посилка, одна поїздка на пошту"

# ---------- Банк заперечень (без LLM): match = regex, answer ≤ 350 символів, HTML дозволено ----------
objections:
  - key: bot
    match: "(ви\\s*бот|це\\s*бот|робот|жива\\s*людин|автовідповід)"
    answer: "Я Оля, помічниця команди Olavita — оформлюю замовлення тут, у чаті 💛 Якщо потрібно, підключу менеджера, вона напише сюди."
  - key: discount
    match: "(знижк|скидк|промокод|акці|дешевше|подешев)"
    answer: "Окремих знижок і промокодів немає — ціна однакова для всіх. Вигода — у наборі: крем для очей разом із сироваткою виходить дешевше, ніж окремо. І платите лише на пошті після огляду."
  - key: price
    match: "(дорог|дорого|не по кишені|забагато грошей)"
    answer: "Розумію. Тому й без передоплати: оглянете на пошті, не підійде — просто не забираєте, з вас 0 грн. Якщо набір зараз забагато — беріть лише сироватку, а крем додасте потім."
  - key: think
    match: "(подума|пізніше|потім напишу|не зараз|ще не вирішил)"
    answer: "Звісно 💛 Нагадаю лише: платити зараз нічого не треба, а скасувати до відправки — одне слово в цей чат. Продовжимо зараз чи нагадати завтра?"
  - key: scam
    match: "(обман|шахра|розвод|лохотрон|не довіря|підозріл|фейк)"
    answer: "Справедливе питання. Передоплати не беремо, дані картки не просимо: гроші віддаєте касиру Нової пошти лише після того, як відкриєте й оглянете. Не підійшло — не забираєте, 0 грн. Реквізити продавця — у чеку НП."
  - key: guarantee
    match: "(гаранті|поверн|повернут|якщо не підійд|не сподоба)"
    answer: "Головна гарантія — огляд до оплати у відділенні: не підійшло — просто не забираєте, нікому нічого не пояснюєте, з вас 0 грн. Платите лише за те, що побачили й тримали в руках."
  - key: prepay
    match: "(передоплат|предоплат|оплатити наперед|оплата наперед|карт(ою|кою)|реквізит)"
    answer: "Передоплати немає взагалі — і це навмисно: ви нічого не ризикуєте. Платите лише на пошті після огляду. Карткою наперед ми не приймаємо."
  - key: delivery_time
    match: "(скільки (йде|їде|чекати)|коли (буде|приїде|прийде)|термін доставк|як швидко)"
    answer: "Зазвичай 1–3 дні Новою поштою. Підтвердите до 15:00 — відправимо сьогодні. Точний день прибуття скаже SMS від Нової пошти з номером накладної."
  - key: where
    match: "(де ви|звідки|яке місто|де знаходит|ваш склад|виробник|країна)"
    answer: "Відправляємо Новою поштою по всій Україні зі складу в Україні. Реквізити продавця — у чеку Нової пошти при отриманні."
  - key: call
    match: "(передзвон|подзвон|зателефон|дзвінок|поговорити голосом)"
    answer: "Добре, передам колезі — вона зателефонує у 9:00–20:00. Замовлення збережу, щоб не повторювати."
    handoff: true
  - key: only_one
    match: "(тільки одн|лише одн|одну сироватк|без крем|не треба крем)"
    answer: "Добре, лише сироватка — 590 грн ✅ Продовжимо."
  - key: how_use
    match: "(як (наносит|користув|застосов)|скільки крапель|вранці чи ввечері|під крем)"
    answer: "3–5 крапель на чисту шкіру обличчя і шиї 1–2 рази на день, зверху — звичний крем або макіяж. Займає 3 хвилини. Перші зміни зазвичай за 7 днів."
  - key: sensitive
    match: "(чутлив|алергі|подразн|висип)"
    answer: "Формула пройшла дерматологічні тести і підходить чутливій шкірі. Якщо є діагностоване захворювання шкіри — порадьтеся з дерматологом, це косметичний засіб, не лікувальний."
