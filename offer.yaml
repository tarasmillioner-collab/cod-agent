# offer.yaml — ЕДИНСТВЕННЫЙ источник цен, наборов, фактов и запретов для бота.
# Правишь здесь — бот меняет поведение без кода. Всё, что LLM говорит о деньгах,
# берётся отсюда через tool get_offer(); цифр вне этого файла бот назвать не может.
#
# Источники: лендинг https://olavita.skinactivelab.com/lp/usual (2026-08-23),
# каталог LP-CRM tallside (product_id 333/341/298), реальные заказы колл-центра
# (наборы «Сироватка», «Сироватка+крем», «Сироватка+крем+філер»).
# unverified: кто платит доставку, ФОП-реквизиты — уточнить у Тараса.

product:
  slug: olavita-serum
  name_ua: "Ліфтинг-сироватка Olavita Liquid Solution"
  short_name: "сироватка"
  volume: "30 мл — на місяць щоденного догляду"
  category: cosmetics
  origin: "unverified"            # = маркировке коробки; не называть, пока не подтверждено
  seller:
    type: "unverified"            # ФОП/ТОВ
    name: "unverified"
    code: "unverified"
    city: "unverified"
  lpcrm:
    site: "olavita.skinactivelab.com"
    office: "13"
    delivery_id: "1"              # Нова Пошта
    payment: "4"                  # оплата при отриманні
    status_confirmed: "11"        # «Прийнято»
    status_new: "3"

# Наборы (лестница). Код набора = set_code в заказе. Цены в грн, целые.
sets:
  - code: s1
    label: "Сироватка Olavita"
    short: "1 сироватка"
    price: 590
    why: "30 мл — на місяць догляду за обличчям і шиєю"
    items:
      - {product_id: "333", name: "Сироватка Olavita Liquid Solution (UA)", price: 590, qty: 1, type: sale}
    shipping: customer            # unverified: доставка НП за тарифом, платить на пошті
    full_cash_text: "590 грн + доставка НП (зазвичай 80–100 грн, точну суму скаже касир)"
    gifts: []
  - code: s2
    label: "Курс 60 днів: 2 сироватки + крем для очей у подарунок"
    short: "курс 60 днів"
    price: 1180
    badge: "Найчастіше беруть"
    why: "два флакони — повний курс 60 днів; крем для очей (590 грн) — у подарунок"
    items:
      - {product_id: "333", name: "Сироватка Olavita Liquid Solution (UA)", price: 590, qty: 2, type: sale}
      - {product_id: "341", name: "Olavita Крем для шкіри навколо очей (подарунок)", price: 0, qty: 1, type: resale}
    shipping: customer
    full_cash_text: "1 180 грн + доставка НП (зазвичай 80–100 грн, точну суму скаже касир)"
    gifts: ["Крем для очей вартістю 590 грн — у подарунок"]
    gift_value: 590

default_set: s1

upsell:
  enabled: true
  from: s1
  to: s2
  moment: after_confirm          # після підтвердження; сума перефіксовується окремим повідомленням
  max_attempts: 1
  text: >-
    {name}, поки збираємо посилку — одне питання. Сироватка працює по обличчю та шиї,
    а шкіра навколо очей утричі тонша: гусячі лапки й набряки вона сама не прибере.
    Тому до сироватки найчастіше беруть крем для очей Olavita — разом 1 089 грн,
    доїде тією ж посилкою, нічого окремо не оформлювати. Додати?
  accept_button: "Так, курс 60 днів — 1 180 грн"
  decline_button: "Лише сироватка — 590 грн"
  suppress_if: [downgraded, objection_price, reentry, said_only_one, night]
  night_hours: [23, 8]           # локальное время Києва: с 23 до 8 не предлагаем
  second_step:                   # s2 -> s3 (філер) — выключено до данных approve-by-set
    enabled: false
    from: s2
    to: s3

delivery:
  carrier: nova_poshta
  default_type: warehouse
  postomat_allowed: true         # только по настоянию + предупреждение об оплате до огляду
  courier_allowed: false
  commission_paid_by: customer   # если customer — слово «рівно» запрещено
  eta_text: "1–3 дні"
  same_day_cutoff: "15:00"
  inspection_text: "оглянете у відділенні до оплати"

storage:
  days: 5
  unit: "робочих днів"
  extension_possible: true
  extension_paid_by: customer

warranty:
  inspect_before_pay: true
  legal_return_days: 14
  brand_return_days: 30          # «30 днів на повернення» — с лендинга
  return_shipping_paid_by: "unverified"
  mechanics_text: "повертаєте через Нову пошту, гроші повертаємо після отримання посилки"

anchor:
  policy: marketplace_proof_only
  old_price: 1997                # на ленде без пруфа → бот НЕ называет зачёркнутую цену
  proof_url: ""
  allowed: false

# Факты, на которые LLM может опираться (get_faq). Всё — с лендинга.
faq_facts:
  what_is: "Сироватка з пептидами (Acetyl Octapeptide-3, Syn-Ake), гідролізованим колагеном, еластином і ніацинамідом. 30 мл — на місяць."
  how_to_use: "3–5 крапель на чисту шкіру обличчя і шиї 1–2 рази на день, зверху звичний крем або макіяж. Займає 3 хвилини."
  results: "Перші зміни — гладкість і сяйво — зазвичай за 7 днів; помітніше розгладження мімічних зморшок — за 2–4 тижні щоденного застосування. Результат індивідуальний."
  course: "Один флакон — місяць догляду. Для стійкого результату радимо курс 3 місяці."
  sensitive_skin: "Формула пройшла 48-годинний дерматологічний тест і тести повторних аплікацій; підходить чутливій шкірі."
  shelf_life: "Після відкриття — 12 місяців."
  eye_cream: "Крем для шкіри навколо очей Olavita — для гусячих лапок, набряків і темних кіл; використовується разом із сироваткою."
  delivery: "Нова пошта по всій Україні, 1–3 дні. Оплата при отриманні після огляду. Передоплати немає."
  return: "30 днів на повернення. Не підійшло у відділенні — просто не забираєте, з вас 0 грн."
  no_prepay: "Передоплат і даних картки не просимо. Платите касиру Нової пошти після огляду."
  where_we_are: "Відправляємо Новою поштою зі складу в Україні. Реквізити продавця — у чеку Нової пошти."
  health_safe_phrase: "Це косметичний засіб для догляду, не лікувальний. Якщо є захворювання шкіри — порадьтеся з дерматологом."
  support_hours: "9:00–20:00"

forbidden_claims:
  - "лікує"
  - "виліковує"
  - "позбавить назавжди"
  - "гарантовано"
  - "замінює ботокс"
  - "як ботокс"
  - "медичн"
  - "клінічно доведено"
  - "100%"

forbidden_actions:
  - discount_off_ladder
  - promo_code
  - prepayment
  - card_details
  - delivery_date_promise
  - timer
  - stock_counter
  - old_price_anchor

brand_voice:
  persona: "Оля з команди Olavita"
  address: "ви"
  max_chars: 350
  emoji_max: 1
  emoji_allowed: ["📦", "✅", "📍", "📱", "💛"]
  client_vocabulary: ["гусячі лапки", "носогубки", "чоло", "овал", "під макіяж", "сяйво"]

